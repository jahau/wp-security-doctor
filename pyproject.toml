[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-security-doctor"
dynamic = ["version"]
description = "Read-only, offline-by-default WordPress security audit CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["wordpress", "security", "audit", "hardening", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/jahau/wp-security-doctor"

[project.scripts]
wp-security-doctor = "wp_security_doctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wp_security_doctor.__version__" }

[tool.setuptools.packages.find]
include = ["wp_security_doctor*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PTH"]
ignore = [
    "S101",   # assert is used for type narrowing
    "PTH123", # open() is fine
    "SIM108",
    "S105", "S106", # flags the word "pass" (Status.PASS, pass_title); no credentials in code
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["wp_security_doctor", "wp_doctor.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

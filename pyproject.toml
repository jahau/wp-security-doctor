[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-security-doctor"
dynamic = ["version"]
description = "Read-only, offline-by-default WordPress security audit CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "wordpress",
    "wordpress-security",
    "security",
    "security-audit",
    "audit",
    "hardening",
    "cli",
    "sarif",
    "code-scanning",
    "github-code-scanning",
    "static-analysis",
    "file-integrity",
    "checksums",
    "devsecops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/jahau/wp-security-doctor"
Documentation = "https://github.com/jahau/wp-security-doctor#readme"
Changelog = "https://github.com/jahau/wp-security-doctor/blob/main/CHANGELOG.md"
Issues = "https://github.com/jahau/wp-security-doctor/issues"

[project.scripts]
wp-security-doctor = "wp_security_doctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wp_security_doctor.__version__" }

[tool.setuptools.packages.find]
include = ["wp_security_doctor*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PTH"]
ignore = [
    "S101",   # assert is used for type narrowing
    "PTH123", # open() is fine
    "SIM108",
    "S105", "S106", # flags the word "pass" (Status.PASS, pass_title); no credentials in code
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["wp_security_doctor", "wp_doctor.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
